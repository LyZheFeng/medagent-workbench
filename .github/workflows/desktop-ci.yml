name: desktop CI

# Typecheck, lint and unit tests for the desktop app and its packages, plus the
# i18n parity tests as their own check, on every PR that touches them and nightly
# on master.
on:
  pull_request:
    paths:
      - .github/workflows/desktop-ci.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/desktop/**
      - packages/**
      - "!apps/desktop/src-tauri/**"
  workflow_dispatch:
  # Agents run the tests before pushing to master; once a day catches what slipped.
  schedule:
    - cron: "47 18 * * *"

permissions:
  contents: read

# Only the newest commit on a ref needs a verdict.
concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # The i18n parity tests already run inside `pnpm test`; this job repeats only
  # those, so "which language lost a key" is its own red check in a PR instead of
  # a needle in a 2000-test log. Same trigger paths — the locales live under
  # apps/desktop/src/i18n.
  i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ai4s/desktop exec vitest run src/i18n
